      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 1301
      KC_HOSTNAME_URL: http://localhost:1301
      KC_HOSTNAME_ADMIN_URL: http://localhost:1301
      KC_HOSTNAME_STRICT: false               # set to true if HTTPS
