
networks:
  sb13-net:
    external: true

volumes:
  pg-sb13-vol:
  keycloak-sb13-vol:

services:
# deploy spring to docker
  spring-sb13:
    image: spring-13:1.0.0
    build: ./spring
    container_name: spring-sb13
    ports:
     - "1333:1333"
    volumes:
     - "/Users/nunea/Desktop/spring-13/spring-upload-file/:/workspace/media-upload-file/"
    environment:
     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-sb13:5432/ecommerce_db
     SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:1301/realms/ecommerce
    #  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak-sb13:8080/realms/ecommerce

     SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak-sb13:8080/realms/ecommerce/protocol/openid-connect/certs
     MEDIA_LOCATION: /workspace/media-upload-file/
    

    #  media.location=/Users/nunea/Desktop/spring-13/spring-upload-file/
    # spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:1301/realms/ecommerce
    # spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:1301/realms/ecommerce/protocol/openid-connect/certs
    networks:
     - sb13-net
    depends_on:
     - postgres-sb13
     - keycloak-sb13 

  # =========================
  # POSTGRESQL
  # =========================
  postgres-sb13:
    image: postgres:18.4
    container_name: postgres-sb13
    restart: unless-stopped

    ports:
      - "1300:5432"

    environment:
      POSTGRES_USER: sb13usr
      POSTGRES_PASSWORD: qwerqwer

    volumes:
      # - pg-sb13-vol:/var/lib/postgresql/18/docker
      - pg-sb13-vol:/var/lib/postgresql
      - ./init_db/:/docker-entrypoint-initdb.d

    networks:
      - sb13-net


  # =========================
  # KEYCLOAK
  # =========================
  keycloak-sb13:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: keycloak-sb13
    restart: unless-stopped

    command:
      - start

    ports:
      - "1301:8080"

    environment:

      # =========================
      # DATABASE CONFIGURATION
      # =========================
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-sb13:5432/keycloak_db
      KC_DB_USERNAME: sb13usr
      KC_DB_PASSWORD: qwerqwer

      # =========================
      # TEMPORARY ADMIN
      # =========================
      KC_BOOTSTRAP_ADMIN_USERNAME: temp_admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: temp_qwerqwer

      # =========================
      # HOSTNAME
      # =========================
      KC_HOSTNAME: http://localhost:1301
      KC_HOSTNAME_ADMIN: http://localhost:1301

      # =========================
      # HTTP
      # =========================
      KC_HTTP_ENABLED: "true"

      # =========================
      # PROXY
      # =========================
      KC_PROXY_HEADERS: xforwarded

      # =========================
      # CACHE
      # =========================
      KC_CACHE: ispn

      # =========================
      # LOGGING
      # =========================
      KC_LOG_LEVEL: INFO

      # =========================
      # HEALTH & METRICS
      # =========================
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"

      # =========================
      # JAVA MEMORY
      # =========================
      JAVA_OPTS_APPEND: "-Xms512m -Xmx2048m"

    volumes:
      - keycloak-sb13-vol:/opt/keycloak/data
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/conf:/opt/keycloak/conf

    networks:
      - sb13-net

    depends_on:
      - postgres-sb13